<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Sarriette</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1208 0%, #2c1f0e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      color: #C8952A;
      margin-bottom: 10px;
    }

    h2 {
      color: #1a1208;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #7a6040;
      font-size: 14px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0e0c0;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3D2C14;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e8d8b8;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #C8952A;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #C8952A;
      color: #1a1208;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #b07d1a;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(200, 149, 42, 0.3);
    }

    .error-msg {
      background: #fdecea;
      border-left: 4px solid #e74c3c;
      color: #e74c3c;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .back-link {
      margin-top: 20px;
    }

    .back-link a {
      color: #b09060;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link a:hover {
      color: #C8952A;
    }

    .info {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">🍽️ S</div>
    <h2>Sarriette Admin</h2>
    <div class="subtitle">Restaurant Management Portal</div>

    <div class="error-msg" id="errorMsg">
      <span id="errorText">Invalid username or password.</span>
    </div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button onclick="login()">Sign In to Dashboard</button>

    <div class="back-link">
      <a href="../sarriette/index.html">← Back to Restaurant Website</a>
    </div>

    <div class="info">
      Demo credentials: admin / admin123
    </div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');

      if (!username || !password) {
        errorText.innerText = 'Please enter both username and password.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username: username, password: password })
        });

        const data = await response.json();

        if (data.success) {
          // Store admin info in session storage
          sessionStorage.setItem('admin_name', data.name);
          window.location.href = 'dashboard.html';
        } else {
          errorText.innerText = data.message || 'Invalid username or password.';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        // Fallback for demo - if PHP not working
        if (username === 'admin' && password === 'admin123') {
          sessionStorage.setItem('admin_name', 'Administrator');
          window.location.href = 'dashboard.html';
        } else {
          errorText.innerText = 'Login failed. Use admin / admin123';
          errorDiv.style.display = 'block';
        }
      }
    }

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>
</html>
